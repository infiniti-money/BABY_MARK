name: BABY MARK scheduled rosters
on:
  schedule:
    - cron: '15 19 * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: babymark-roster-automation
  cancel-in-progress: false
jobs:
  roster:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ROSTER_SECRET: ${{ secrets.BABYMARK_ROSTER_CRON_SECRET }}
    steps:
      - name: Generate opted-in future rosters
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ROSTER_SECRET:-}" ]]; then
            echo "Skipped: scheduler secret not configured."
            exit 0
          fi
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          curl --fail --silent --show-error --max-time 90 --output "$response" --request POST --header "Authorization: Bearer $ROSTER_SECRET" 'https://babymark.pages.dev/api/maintenance/rosters'
          jq -e '.branches | type == "array"' "$response" >/dev/null
          mapfile -t branches < <(jq -r '.branches[]' "$response")
          failed=0
          for branch in "${branches[@]}"; do
            if ! [[ "$branch" =~ ^[a-zA-Z0-9._-]{1,64}$ ]]; then exit 1; fi
            if curl --fail --silent --show-error --max-time 30 --output "$response" --request POST --header "Authorization: Bearer $ROSTER_SECRET" "https://babymark.pages.dev/api/maintenance/rosters?branch_id=$branch"; then
              jq '{created,skipped,failed}' "$response"
              if ! jq -e '.failed == 0' "$response" >/dev/null; then failed=1; fi
            else failed=1; fi
          done
          exit "$failed"
