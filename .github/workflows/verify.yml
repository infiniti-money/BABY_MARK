name: Verify Cloudflare BABY MARK
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_LOG_PATH: work/wrangler.log
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Verify pinned runtime and release metadata
        run: node scripts/check-release-metadata.mjs
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies (high and critical gate)
        run: npm audit --include=dev --audit-level=high
      - run: npm test
      - run: npm run check:runtime
      - run: npx --no-install playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - run: npm run test:mobile
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            work/playwright-results
            work/playwright-mobile-results
          retention-days: 7
# Verification only. No deployment, remote migrations, resource provisioning,
# scheduled cleanup, or production credentials are used by this workflow.
