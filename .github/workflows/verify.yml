name: Verify Cloudflare BABY MARK
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloudflare:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_LOG_PATH: work/wrangler.log
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:runtime
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - run: npm run test:mobile
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            work/playwright-results
            work/playwright-mobile-results
          retention-days: 7
# Verification only. No deployment, remote migrations, resource provisioning,
# scheduled cleanup, or production credentials are used by this workflow.
