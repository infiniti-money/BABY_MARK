name: BABY MARK Native Mobile
on:
  pull_request:
    paths:
      - 'apps/native/**'
      - 'apps/mobile/assets/app-icon.png'
      - '.github/workflows/native-mobile.yml'
  push:
    branches: [main]
    paths:
      - 'apps/native/**'
      - 'apps/mobile/assets/app-icon.png'
      - '.github/workflows/native-mobile.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-mobile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Configure JDK 17
        shell: bash
        run: |
          test -x "$JAVA_HOME_17_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK 36
        shell: bash
        run: |
          java -version
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          bash apps/native/prepare-assets.sh android

      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Build and lint test APK
        run: apps/native/android/gradlew -p apps/native/android --no-daemon lintDebug assembleDebug lintRelease assembleRelease
      - name: Verify APK debug signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose apps/native/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: BABY-MARK-Android-debug-APK
          path: apps/native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Prepare icon and validate project
        run: |
          xcodebuild -version
          bash apps/native/prepare-assets.sh ios
          plutil -lint apps/native/ios/BABYMARK/Info.plist
          xcodebuild -list -project apps/native/ios/BABYMARK.xcodeproj
      - name: Compile unsigned device app (not an installable IPA)
        run: |
          xcodebuild -project apps/native/ios/BABYMARK.xcodeproj -scheme BABYMARK -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/babymark-ios" CODE_SIGNING_ALLOWED=NO build
          mkdir -p work/native
          ditto -c -k --keepParent "$RUNNER_TEMP/babymark-ios/Build/Products/Release-iphoneos/BABYMARK.app" work/native/BABY-MARK-iOS-unsigned-app.zip
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: BABY-MARK-iOS-unsigned-compile-only
          path: work/native/BABY-MARK-iOS-unsigned-app.zip
          if-no-files-found: error
          retention-days: 7
