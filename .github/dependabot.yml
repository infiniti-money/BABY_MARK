version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 3
    versioning-strategy: increase
    groups:
      cloudflare-toolchain:
        patterns:
          - wrangler
          - miniflare
      browser-testing:
        patterns:
          - '@playwright/*'
          - playwright*
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 2
