<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timemark Studio | BABY MARK</title><style>*{box-sizing:border-box}body{margin:0;background:#fff1f4;color:#632334;font:15px system-ui}main{max-width:1000px;margin:auto;padding:24px}h1{margin-bottom:4px}p{line-height:1.5}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}section{background:#fff;padding:20px;border-radius:20px;border:1px solid #efd8df}label{display:block;margin:12px 0}input,select{display:block;width:100%;padding:10px;border:1px solid #e3c9d1;border-radius:10px;font:inherit;margin-top:6px}button{background:#c91e3c;color:#fff;border:0;border-radius:12px;padding:12px;font:inherit;font-weight:700;cursor:pointer}svg{display:block;width:100%;height:auto}#preview{background:#c7b9c0;border-radius:18px;overflow:hidden;position:relative}small{color:#795965}@media(max-width:680px){.layout{grid-template-columns:1fr}main{padding:12px}}</style></head><body><main><h1>Timemark Studio</h1><p>BABY MARK · Xem trước thiết kế bằng dữ liệu giả định. Không thu thập ảnh hoặc thông tin thật.</p><div class="layout"><section><h2>Tùy chỉnh mẫu</h2><label>Loại chấm công<select id="type"><option value="IN">Vào ca</option><option value="OUT">Tan ca</option></select></label><label>Cửa hàng<input id="branch" maxlength="120" value="BABYMARK LUXURY XUÂN QUAN"></label><label>Tên nhân viên (mẫu)<input id="employee" maxlength="120" value="Nguyễn Văn A"></label><label>Khoảng cách giả định (m)<input id="distance" type="number" min="0" max="2000" value="22"></label><label>Thời gian giả định<select id="clock"><option value="late">Đi muộn / về sớm</option><option value="ontime">Đúng giờ</option></select></label><label>Địa chỉ minh họa<input id="address" maxlength="180" value="Địa chỉ minh họa, chưa xác minh"></label><button id="reset">Khôi phục mẫu</button><p><small>Không dùng thời gian hoặc tọa độ của thiết bị. Không phải công cụ tạo bằng chứng.</small></p></section><section><div id="preview"></div><p id="info"></p></section></div></main><script type="module">import{makeTimemark}from'./assets/timemark-layout.mjs';const e=id=>document.getElementById(id);function update(){const type=e('type').value,late=e('clock').value==='late',start=Date.parse('2026-11-24T01:00:00Z'),end=Date.parse('2026-11-24T09:00:00Z');const m={type,serverTimestamp:type==='IN'?start+(late?135000:0):end-(late?135000:0),shiftStart:start,shiftEnd:end,branchName:e('branch').value||'Cửa hàng mẫu',employeeName:e('employee').value||'Nhân viên mẫu',employeeCode:'BM001',lat:20.123456,lng:106.123456,accuracy:8,radius:100,distance:Math.min(2000,Math.max(0,Number(e('distance').value)||0)),address:e('address').value};e('preview').innerHTML=makeTimemark(m,{preview:true});e('info').textContent='Mẫu 800 × 1200 px · vùng xám là ảnh camera · JPEG thực tế tối đa 200 KB';}document.querySelectorAll('input,select').forEach(x=>x.addEventListener('input',update));e('reset').addEventListener('click',()=>location.reload());update();</script></body></html>
